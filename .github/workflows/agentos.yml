name: AgentOS fork checks
on:
  push:
    branches: ["agentos/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agentos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, pinned with upstream
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: "9.15.4"
      - run: pnpm install --frozen-lockfile
      - name: Prepare the package-owned Rust toolchain
        working-directory: packages/paperclip-runner
        run: rustup show
      - name: Build generated SDK inputs
        run: pnpm --filter @paperclipai/plugin-sdk build
      - run: pnpm -r typecheck
      - run: pnpm --filter @paperclipai/db check:migrations
      - run: pnpm --filter @paperclipai/teams-catalog validate
      - run: pnpm --filter @paperclipai/teams-catalog test
      - run: node scripts/check-maps.mjs
      - run: pnpm check:token-gates
      - name: Verify application persistence, authorization, API discovery, and installation
        run: pnpm exec vitest run server/src/__tests__/friday-awareness.test.ts server/src/__tests__/attention-service.test.ts ui/src/lib/friday-workspace.test.ts ui/src/components/FridayAttention.test.tsx ui/src/hooks/useFridayUpdates.test.tsx server/src/__tests__/managed-applications.test.ts server/src/__tests__/openapi-routes.test.ts server/src/__tests__/ai-connections.test.ts server/src/__tests__/git-credentials.test.ts server/src/__tests__/muse-client-contract.test.ts server/src/__tests__/invite-join-grants.test.ts ui/src/components/FridayWorkspace.test.tsx ui/src/components/TaskChatThread.test.tsx ui/src/components/task-side-panel/TaskAttachmentPanel.test.tsx ui/src/lib/html-preview.test.ts ui/src/components/FridayVoiceControls.test.tsx ui/src/components/PortfolioGalaxy.test.tsx ui/src/pages/Applications.test.tsx ui/src/pages/ApplicationDetail.test.tsx ui/src/pages/TeamCatalog.test.tsx ui/src/pages/useInstallTeamCatalogEntry.test.tsx ui/src/lib/company-routes.test.ts ui/src/App.test.tsx
      - name: Verify shared workforce isolation, retirement, ownership and UI
        run: >-
          pnpm exec vitest run --maxWorkers=1
          server/src/__tests__/agentos-workforce.test.ts
          server/src/__tests__/board-claim.test.ts
          server/src/modules/agent-lifecycle/__tests__/lifecycle.test.ts
          server/src/services/case-deletion.test.ts
          ui/src/pages/Workforce.test.tsx
          ui/src/lib/activity-format.test.ts
          ui/src/components/DestructiveThemeTokens.test.ts
      - run: pnpm build
